# Configuración de pytest.
[pytest]
# Carpeta donde viven los tests.
testpaths = tests
# Patrón de archivos/clases/funciones de test.
python_files = test_*.py
python_functions = test_*
# Opciones por defecto al ejecutar `pytest`:
#   -v            salida detallada (un renglón por test, con su nombre en español).
#   --tb=short    trazas de error compactas.
#   --strict-markers  obliga a declarar los marcadores (evita erratas silenciosas).
addopts = -v --tb=short --strict-markers
